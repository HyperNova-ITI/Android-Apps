# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true

# Kotlin code style: "official" or "obsolete".
kotlin.code.style=official

# Enable per-module AndroidX.
android.useAndroidX=true
android.nonTransitiveRClass=true

# -----------------------------------------------------------------------------
# HyperNova Climate — vehicle backend selection (deployment macro).
#
#   ETHERNET  -> VehicleGatewayClimateBackend: direct TCP/UDP frame link to the
#                bare-metal TC397 (192.168.10.30:6001 / telemetry :6000).
#   VHAL      -> CarPropertyClimateBackend: standard AAOS CarPropertyManager,
#                real values bridged inside a custom VHAL.
#
# This value is compiled into BuildConfig.CLIMATE_BACKEND and read once by the
# ClimateBackendFactory. Override at build time:  -Pclimate.backend=VHAL
# Direct Ethernet is enabled for now.
# -----------------------------------------------------------------------------
climate.backend=ETHERNET
